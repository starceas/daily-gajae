name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: run all test suites
        run: |
          rc=0
          for t in gate diary course mutations; do
            echo "=== tests/$t ==="
            bash "tests/$t/run.sh" || rc=1
          done
          exit "$rc"
